<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | CMN WebDesigner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 10px; }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            obsidian: '#070A1A',
            surface: '#12152A',
            discord: '#5865F2',
            gold: '#D4AF37'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-obsidian text-white min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
  
  <!-- Background Glow Effects -->
  <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-discord/20 rounded-full blur-[100px] pointer-events-none"></div>
  <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-gold/10 rounded-full blur-[100px] pointer-events-none"></div>

  <!-- Glassmorphism Login Card -->
  <div class="relative w-full max-w-md bg-white/5 backdrop-blur-xl border border-white/10 rounded-2xl shadow-[0_20px_60px_rgba(0,0,0,0.5)] p-8 z-10 transition-all duration-300">
    
    <!-- Not Logged In View -->
    <div id="login-view" class="flex flex-col items-center text-center">
      <div class="w-16 h-16 bg-white/10 rounded-xl flex items-center justify-center mb-6 border border-white/5">
        <svg class="w-8 h-8 text-gold" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
        </svg>
      </div>
      <h2 class="text-2xl font-bold mb-2 tracking-tight">Autentificare</h2>
      <p class="text-white/60 text-sm mb-8">Conectează-te pentru a accesa platforma și beneficiile comunității.</p>
      
      <button onclick="loginWithDiscord()" class="w-full flex items-center justify-center gap-3 bg-discord hover:bg-[#4752C4] text-white font-semibold py-3 px-6 rounded-xl transition-all duration-200 transform hover:scale-[1.02] shadow-lg shadow-discord/30">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
          <path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z"/>
        </svg>
        Login cu Discord
      </button>
    </div>

    <!-- Logged In View (Hidden by default) -->
    <div id="profile-view" class="hidden flex-col items-center text-center">
      <div class="relative mb-4">
        <img id="user-avatar" src="" alt="Avatar" class="w-24 h-24 rounded-full border-2 border-gold/50 shadow-lg shadow-gold/20 object-cover">
        <div class="absolute bottom-0 right-0 w-6 h-6 bg-green-500 border-2 border-obsidian rounded-full"></div>
      </div>
      <h2 id="user-name" class="text-2xl font-bold mb-1">...</h2>
      <p class="text-white/60 text-sm mb-6 flex items-center justify-center gap-2">
        <span class="w-2 h-2 rounded-full bg-green-500"></span> Conectat cu succes
      </p>
      
      <div class="w-full bg-black/20 rounded-xl p-4 mb-6 border border-white/5 text-left">
        <p class="text-xs text-white/40 uppercase font-semibold mb-1">Status Cont</p>
        <p class="text-sm text-white/90">Autentificarea a fost realizată prin OAuth2. Poți accesa acum dashboard-ul.</p>
      </div>

      <button onclick="logout()" class="w-full bg-white/5 hover:bg-white/10 text-white font-medium py-3 px-6 rounded-xl border border-white/10 transition-colors">
        Deconectare
      </button>
    </div>

  </div>

  <script>
    // 1. CONFIGURARE APLICAȚIE DISCORD
    // Înlocuiește cu datele din Discord Developer Portal
    const CLIENT_ID = '1563926720959094896'; 
   const REDIRECT_URI = encodeURIComponent('[https://bump-discord.vercel.app](https://bump-discord.vercel.app)');

    function loginWithDiscord() {
      // Deschide fereastra de autorizare Discord
      const discordAuthUrl = `https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${REDIRECT_URI}&response_type=token&scope=identify`;
      window.location.href = discordAuthUrl;
    }

    function logout() {
      localStorage.removeItem('discord_token');
      window.location.hash = '';
      window.location.reload();
    }

    // Verificăm dacă URL-ul conține token-ul după ce Discord face redirect
    window.onload = () => {
      const fragment = new URLSearchParams(window.location.hash.slice(1));
      const accessToken = fragment.get('access_token');

      if (accessToken) {
        // Salvăm token-ul local
        localStorage.setItem('discord_token', accessToken);
        // Curățăm URL-ul pentru un aspect curat
        window.history.replaceState(null, null, window.location.pathname);
      }

      const savedToken = localStorage.getItem('discord_token');
      
      if (savedToken) {
        // Dacă avem token, preluăm datele utilizatorului
        fetch('https://discord.com/api/users/@me', {
          headers: {
            authorization: `Bearer ${savedToken}`,
          },
        })
        .then(result => result.json())
        .then(response => {
          if (response.message === '401: Unauthorized') {
            logout();
            return;
          }
          
          // Ascundem formularul de login și afișăm profilul
          document.getElementById('login-view').classList.add('hidden');
          document.getElementById('profile-view').classList.remove('hidden');
          document.getElementById('profile-view').classList.add('flex');
          
          // Actualizăm UI-ul cu datele reale
          const { username, discriminator, avatar, id } = response;
          const displayName = discriminator === '0' ? username : `${username}#${discriminator}`;
          document.getElementById('user-name').innerText = displayName;
          
          // Generăm link-ul pentru avatar
          const avatarUrl = avatar 
            ? `https://cdn.discordapp.com/avatars/${id}/${avatar}.png?size=256` 
            : `https://cdn.discordapp.com/embed/avatars/${parseInt(discriminator || 0) % 5}.png`;
          
          document.getElementById('user-avatar').src = avatarUrl;
        })
        .catch(console.error);
      }
    };
  </script>
</body>
</html>
